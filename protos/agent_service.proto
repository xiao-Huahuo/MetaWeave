syntax = "proto3";

package agent_service;

import "google/protobuf/struct.proto";

// ---------------------------------------------------------------------------
// AgentService — Agent 微服务 gRPC 接口定义
//
// 覆盖能力:
//   - AgentCore 的 4 个方法（流式 / 非流式 × 有状态 / 无状态）
//   - SessionService 的 5 个 CRUD 方法
// ---------------------------------------------------------------------------

service AgentService {
  // ---- Agent 调用 ----

  // 无状态流式运行（无长期记忆 / 知识库召回）。
  rpc StreamRun(RunRequest) returns (stream ChunkMessage);

  // 无状态单次运行，返回结构化结果。
  rpc RunOnce(RunRequest) returns (RunResult);

  // 带 session 上下文的流式运行（长期记忆召回 + 消息持久化 + 逐节点推送）。
  rpc StreamSessionPrompt(RunRequest) returns (stream ChunkMessage);

  // 带 session 上下文的单次运行，缓冲全部节点后返回结构化结果。
  rpc RunSessionPrompt(RunRequest) returns (RunResult);

  // ---- Session 管理 ----

  rpc CreateSession(SessionCreateRequest) returns (SessionResponse);

  rpc GetSession(SessionIdRequest) returns (SessionResponse);

  rpc ListUserSessions(ListSessionsRequest) returns (ListSessionsResponse);

  rpc UpdateSessionName(SessionUpdateRequest) returns (SessionResponse);

  rpc DeleteSession(SessionIdRequest) returns (DeleteResponse);

  rpc DeleteAllSessions(DeleteAllSessionsRequest) returns (DeleteResponse);

  // ---- 消息历史 ----

  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  // ---- 取消执行 ----

  // 取消指定 session 正在执行的图,中断后部分输出自动保存。
  rpc CancelSession(CancelRequest) returns (CancelResponse);

  // ---- 子 Agent ----
  rpc ListChildAgents(ChildAgentListRequest) returns (ChildAgentListResponse);
  rpc StopChildAgent(ChildAgentControlRequest) returns (ChildAgentControlResponse);
  rpc UpdateChildAgent(ChildAgentUpdateRequest) returns (ChildAgentControlResponse);

  // ---- 观测 / trace 事件 ----

  rpc GetEvents(EventsRequest) returns (EventsResponse);
  rpc GetRecallDetails(RecallDetailsRequest) returns (RecallDetailsResponse);
  rpc GetTaskSuggestions(TaskSuggestionsRequest) returns (TaskSuggestionsResponse);
  rpc GetTokenUsage(TokenUsageRequest) returns (google.protobuf.Struct);
  rpc GetActivityHeatmap(ActivityHeatmapRequest) returns (google.protobuf.Struct);
  rpc GetRegisteredTools(ToolListRequest) returns (ToolListResponse);
  rpc GetSessionAttachment(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetSessionAttachmentRaw(AttachmentRawRequest) returns (AttachmentRawResponse);

  // ---- 用户设置 ----

  rpc EnsureUserProfile(UserProfileRequest) returns (UserProfileResponse);
  rpc UpdateUserKnowledgeDir(UserKnowledgeDirUpdateRequest) returns (UserProfileResponse);
  rpc GetLLMConfig(LLMConfigRequest) returns (LLMConfigResponse);
  rpc SaveLLMConfig(LLMConfigSaveRequest) returns (LLMConfigResponse);
  rpc ListLLMConfigPresets(LLMConfigRequest) returns (LLMConfigPresetListResponse);
  rpc SaveLLMConfigPreset(LLMConfigPresetSaveRequest) returns (LLMConfigPresetResponse);
  rpc DeleteLLMConfigPreset(LLMConfigPresetDeleteRequest) returns (DeleteResponse);
  rpc GetWebSearchConfig(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc SaveWebSearchConfig(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetFontConfig(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc SaveFontConfig(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetAppearanceConfig(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc SaveAppearanceConfig(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetKnowledgeIngestionConfig(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc SaveKnowledgeIngestionConfig(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetVlmConfig(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc SaveVlmConfig(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListVlmConfigPresets(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc SaveVlmConfigPreset(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DeleteVlmConfigPreset(google.protobuf.Struct) returns (google.protobuf.Struct);

  // 知识库重建与上传
  rpc RebuildKnowledge(KnowledgeRebuildRequest) returns (KnowledgeRebuildResponse);
  rpc UploadKnowledgeFile(KnowledgeFileUploadRequest) returns (KnowledgeRebuildResponse);
  rpc ListKnowledgeFiles(KnowledgeFileTreeRequest) returns (KnowledgeFileTreeResponse);
  rpc ReadKnowledgeFile(KnowledgeFileContentRequest) returns (KnowledgeFileContentResponse);
  rpc PreviewKnowledgePdfPage(KnowledgePdfPageRequest) returns (KnowledgePdfPageResponse);
  rpc WriteKnowledgeFile(KnowledgeFileWriteRequest) returns (KnowledgeFileNode);
  rpc CreateKnowledgeFile(KnowledgeFileCreateRequest) returns (KnowledgeFileNode);
  rpc CreateKnowledgeFolder(KnowledgeFolderCreateRequest) returns (KnowledgeFileNode);
  rpc CopyKnowledgePath(KnowledgePathCopyRequest) returns (KnowledgeFileNode);
  rpc DeleteKnowledgePath(KnowledgePathDeleteRequest) returns (DeleteResponse);
  rpc RenameKnowledgePath(KnowledgePathRenameRequest) returns (KnowledgeFileNode);
  rpc CreateKnowledgeIngestionJobs(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListKnowledgeIngestionJobs(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc CancelKnowledgeIngestionJob(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc SearchAllLibraries(google.protobuf.Struct) returns (google.protobuf.Struct);

  // 当前 active 知识库的 Git 管理
  rpc GetGitStatus(GitUserRequest) returns (google.protobuf.Struct);
  rpc InitGitRepository(GitInitRequest) returns (google.protobuf.Struct);
  rpc GetGitHistory(GitHistoryRequest) returns (google.protobuf.Struct);
  rpc GetGitDiff(GitDiffRequest) returns (google.protobuf.Struct);
  rpc RestoreGitPaths(GitPathsRequest) returns (google.protobuf.Struct);
  rpc CommitGitPaths(GitCommitRequest) returns (google.protobuf.Struct);
  rpc PushGitBranch(GitPushRequest) returns (google.protobuf.Struct);
  rpc CreateGitBranch(GitBranchRequest) returns (google.protobuf.Struct);
  rpc AddGitRemote(GitRemoteRequest) returns (google.protobuf.Struct);
  rpc SwitchGitBranch(GitBranchRequest) returns (google.protobuf.Struct);
  rpc PullGitBranch(GitPullRequest) returns (google.protobuf.Struct);

  // 系统提示词条目
  rpc ListSystemPromptEntries(SystemPromptRequest) returns (SystemPromptEntriesResponse);
  rpc AddSystemPromptEntry(SystemPromptAddRequest) returns (SystemPromptEntryResponse);
  rpc DeleteSystemPromptEntry(SystemPromptDeleteRequest) returns (DeleteResponse);

  // 自定义长期记忆
  rpc ListCustomMemories(MemoryListRequest) returns (MemoryListResponse);
  rpc AddCustomMemory(MemoryAddRequest) returns (MemoryEntryResponse);
  rpc DeleteCustomMemory(MemoryDeleteRequest) returns (DeleteResponse);

  // 用户收藏
  rpc ListFavorites(FavoriteListRequest) returns (FavoriteListResponse);
  rpc AddFavorite(FavoriteCreateRequest) returns (FavoriteEntryResponse);
  rpc DeleteFavorite(FavoriteDeleteRequest) returns (DeleteResponse);

  // 用户隐私
  rpc ListPrivacy(PrivacyListRequest) returns (PrivacyListResponse);
  rpc AddPrivacy(PrivacyCreateRequest) returns (PrivacyEntryResponse);
  rpc DeletePrivacy(PrivacyDeleteRequest) returns (DeleteResponse);

  // 用户反馈
  rpc ListFeedback(FeedbackListRequest) returns (FeedbackListResponse);
  rpc AddFeedback(FeedbackCreateRequest) returns (FeedbackEntryResponse);
  rpc UpdateFeedback(FeedbackUpdateRequest) returns (FeedbackEntryResponse);
  rpc DeleteFeedback(FeedbackDeleteRequest) returns (DeleteResponse);

  // 密码库: 与 REST /vault 对齐,使用 Struct 承载独立 vault token 和业务字段。
  rpc VaultStatus(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultDebugMasterPassword(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultSetup(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultUnlock(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultResetPassword(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultLock(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultListItems(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultGetItem(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultCreateItem(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultUpdateItem(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultMoveToTrash(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultRestoreItems(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultPurgeItems(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultExportItems(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultImportItems(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc VaultListTags(google.protobuf.Struct) returns (google.protobuf.Struct);

  // 第五种库：组件库列表与源码上传，与 REST /component-library 对齐。
  rpc ListComponentLibraryComponents(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc CreateComponentLibraryComponent(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc RenameComponentLibraryComponent(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DeleteComponentLibraryComponent(google.protobuf.Struct) returns (google.protobuf.Struct);

  // Agent 单轮局部变更与安全撤销
  rpc GetSessionChanges(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc UndoSessionChange(google.protobuf.Struct) returns (google.protobuf.Struct);

  // Persistent Agent task queue. Struct keeps the gRPC payload identical to
  // the typed REST DTO fields while queue state remains in the shared service.
  rpc ListAgentQueueTasks(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc CreateAgentQueueTask(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc UpdateAgentQueueTask(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ContinueAgentQueueTask(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc TransitionAgentQueueTask(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DeleteAgentQueueTask(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc UpdateAgentQueueSettings(google.protobuf.Struct) returns (google.protobuf.Struct);

  // LaTeX 运行时、编译和缓存管理，与 REST /settings/latex、/knowledge/latex 对齐。
  rpc GetLatexStatus(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc StartLatexInstall(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc CancelLatexInstall(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc UninstallManagedLatex(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc CompileLatex(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ClearLatexStorage(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetLatexManagement(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetModelManagement(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetModelPreferences(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc SaveModelPreferences(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc InitializeModels(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc StartModelDownload(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DeleteManagedModel(google.protobuf.Struct) returns (google.protobuf.Struct);

  // Scheduled Agent automation. Struct mirrors the existing REST request
  // fields while serialized tasks and runs keep their current camelCase form.
  rpc ListAutomations(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc CreateAutomation(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ToggleAutomation(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListAutomationRuns(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DeleteAutomation(google.protobuf.Struct) returns (google.protobuf.Struct);
  // 智能表格删除，与 REST DELETE /smart-forms/{form_id} 对齐。
  rpc DeleteSmartForm(google.protobuf.Struct) returns (google.protobuf.Struct);
  // 文献阅读行级能力，与 REST /literature-reading 对齐。
  rpc ListLiteratureEntries(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc TouchLiteratureEntry(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc PatchLiteratureRow(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DuplicateLiteratureRow(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DeleteLiteratureRow(google.protobuf.Struct) returns (google.protobuf.Struct);
}

// ---------------------------------------------------------------------------
// 知识库 Git 管理
// ---------------------------------------------------------------------------

message GitUserRequest {
  string user_id = 1;
}

message GitInitRequest {
  string user_id = 1;
  string initial_branch = 2;
}

message GitHistoryRequest {
  string user_id = 1;
  int32 limit = 2;
}

message GitDiffRequest {
  string user_id = 1;
  string path = 2;
  bool staged = 3;
}

message GitPathsRequest {
  string user_id = 1;
  repeated string paths = 2;
}

message GitCommitRequest {
  string user_id = 1;
  repeated string paths = 2;
  string message = 3;
}

message GitPushRequest {
  string user_id = 1;
  string local_branch = 2;
  string remote = 3;
  string remote_branch = 4;
  bool force_with_lease = 5;
  bool set_upstream = 6;
  bool all_branches = 7;
}

message GitBranchRequest {
  string user_id = 1;
  string name = 2;
  bool checkout = 3;
}

message GitRemoteRequest {
  string user_id = 1;
  string name = 2;
  string url = 3;
}

message GitPullRequest {
  string user_id = 1;
  string remote = 2;
  string branch = 3;
}

// ---------------------------------------------------------------------------
// 通用请求 / 响应
// ---------------------------------------------------------------------------

message RunRequest {
  string prompt = 1;
  string user_id = 2;
  string session_id = 3;
  // 用户从文档中明确引用、需要随问题送入上下文的文本。
  string reference = 4;
  // Agent Loop 模式: auto / simple / react / plan。
  string agent_mode = 5;
  // Agent 权限模式: readonly / sandbox / full_access。
  string agent_access_mode = 6;
}

message RunResult {
  string graph_diagram = 1;
  string final_output = 2;
  repeated google.protobuf.Struct events = 3;
  string graph_diagram_path = 4;
}

// ---------------------------------------------------------------------------
// 流式推送块
// ---------------------------------------------------------------------------

message ToolCall {
  string name = 1;
  google.protobuf.Struct args = 2;
  string id = 3;
}

message TraceEntry {
  string node = 1;
  string event = 2;
  string error_type = 3;
  string message = 4;
}

message ChunkMessage {
  string node = 1;
  string content = 2;
  repeated ToolCall tool_calls = 3;
  repeated TraceEntry trace = 4;
  bool done = 5;
  string model_name = 6;
  string type = 7;
  repeated google.protobuf.Struct context_messages = 8;
  google.protobuf.Struct metadata = 9;
  // error 事件携带的友好错误信息。
  string error = 10;
}

// ---------------------------------------------------------------------------
// Session 管理消息
// ---------------------------------------------------------------------------

message SessionCreateRequest {
  string user_id = 1;
  string session_name = 2;
}

message SessionIdRequest {
  string session_id = 1;
}

message ListSessionsRequest {
  string user_id = 1;
}

message SessionUpdateRequest {
  string session_id = 1;
  string session_name = 2;
}

message SessionResponse {
  string session_id = 1;
  string user_id = 2;
  string session_name = 3;
  // ISO 8601 格式 UTC 时间字符串。
  string created_at = 4;
  string updated_at = 5;
}

message ListSessionsResponse {
  repeated SessionResponse sessions = 1;
}

message DeleteResponse {
  bool ok = 1;
  // deleted_count 仅在 DeleteAllSessions 时有意义。
  int32 deleted_count = 2;
}

message DeleteAllSessionsRequest {
  string user_id = 1;
}

// ---------------------------------------------------------------------------
// 用户收藏
// ---------------------------------------------------------------------------

message FavoriteListRequest {
  string user_id = 1;
  string target_type = 2;
  string library_id = 3;
  bool filter_library = 4;
}

message FavoriteCreateRequest {
  string user_id = 1;
  string library_id = 2;
  string target_type = 3;
  string target_id = 4;
}

message FavoriteDeleteRequest {
  string user_id = 1;
  string library_id = 2;
  string target_type = 3;
  string target_id = 4;
}

message FavoriteEntryResponse {
  string favorite_id = 1;
  string user_id = 2;
  string library_id = 3;
  string target_type = 4;
  string target_id = 5;
  string created_at = 6;
}

message FavoriteListResponse {
  repeated FavoriteEntryResponse favorites = 1;
}

message PrivacyListRequest {
  string user_id = 1;
  string target_type = 2;
  string library_id = 3;
  bool filter_library = 4;
}

message PrivacyCreateRequest {
  string user_id = 1;
  string library_id = 2;
  string target_type = 3;
  string target_id = 4;
}

message PrivacyDeleteRequest {
  string user_id = 1;
  string library_id = 2;
  string target_type = 3;
  string target_id = 4;
}

message PrivacyEntryResponse {
  string privacy_id = 1;
  string user_id = 2;
  string library_id = 3;
  string target_type = 4;
  string target_id = 5;
  string created_at = 6;
}

message PrivacyListResponse {
  repeated PrivacyEntryResponse privacy = 1;
}

// ---------------------------------------------------------------------------
// 用户反馈
// ---------------------------------------------------------------------------

message FeedbackCreateRequest {
  string user_id = 1;
  string content = 2;
  string source = 3;
  string page = 4;
}

message FeedbackListRequest {
  string user_id = 1;
}

message FeedbackUpdateRequest {
  string feedback_id = 1;
  string content = 2;
}

message FeedbackDeleteRequest {
  string feedback_id = 1;
}

message FeedbackEntryResponse {
  string feedback_id = 1;
  string user_id = 2;
  string content = 3;
  string source = 4;
  string page = 5;
  string created_at = 6;
}

message FeedbackListResponse {
  repeated FeedbackEntryResponse feedback = 1;
}

// ---------------------------------------------------------------------------
// 消息历史
// ---------------------------------------------------------------------------

message ListMessagesRequest {
  string user_id = 1;
  string session_id = 2;
  int32 limit = 3;
}

message MessageEntry {
  string message_id = 1;
  string session_id = 2;
  string user_id = 3;
  string role = 4;
  string content = 5;
  repeated ToolCall tool_calls = 6;
  google.protobuf.Struct metadata = 7;
  // ISO 8601 格式 UTC 时间字符串。
  string created_at = 8;
}

message ListMessagesResponse {
  repeated MessageEntry messages = 1;
}

// ---------------------------------------------------------------------------
// 观测 / trace 事件
// ---------------------------------------------------------------------------

message EventsRequest {
  string user_id = 1;
  string session_id = 2;
}

message EventEntry {
  string message_id = 1;
  string role = 2;
  string node = 3;
  string content = 4;
  repeated ToolCall tool_calls = 5;
  // ISO 8601 格式 UTC 时间字符串。
  string created_at = 6;
  google.protobuf.Struct metadata = 7;
}

message EventsResponse {
  string session_id = 1;
  string user_id = 2;
  int32 event_count = 3;
  repeated EventEntry events = 4;
}

message RecallDetailsRequest {
  string user_id = 1;
  string session_id = 2;
}

message RecallDetailsResponse {
  string session_id = 1;
  string user_id = 2;
  string created_at = 3;
  string query = 4;
  google.protobuf.Struct rag_metrics = 5;
  google.protobuf.Struct memory_recall = 6;
  google.protobuf.Struct knowledge_recall = 7;
}

message TaskSuggestionsRequest {
  string user_id = 1;
  string session_id = 2;
}

message TaskSuggestionsResponse {
  repeated string suggestions = 1;
}

message TokenUsageRequest {
  string user_id = 1;
  string session_id = 2;
  string interval = 3;
  int32 limit = 4;
}

message ActivityHeatmapRequest {
  string user_id = 1;
  int32 days = 2;
  string timezone = 3;
}

message ToolListRequest {
}

message ToolInfo {
  string name = 1;
  string display_name = 2;
  string description = 3;
  google.protobuf.Struct args_schema = 4;
  int32 argument_count = 5;
}

message ToolListResponse {
  int32 tool_count = 1;
  repeated ToolInfo tools = 2;
}

// ---------------------------------------------------------------------------
// 取消执行
// ---------------------------------------------------------------------------

message CancelRequest {
  string session_id = 1;
}

message CancelResponse {
  bool ok = 1;
}

message ChildAgentListRequest {
  string session_id = 1;
}

message ChildAgentRecord {
  string run_id = 1;
  string parent_run_id = 2;
  string goal = 3;
  string mode = 4;
  string status = 5;
  string access_mode = 6;
  repeated string allowed_tools = 7;
  string summary = 8;
  string result_json = 9;
  string error = 10;
  string category = 11;
  string name = 12;
}

message ChildAgentListResponse {
  string session_id = 1;
  repeated ChildAgentRecord children = 2;
}

message ChildAgentControlRequest {
  string run_id = 1;
}

message ChildAgentUpdateRequest {
  string run_id = 1;
  google.protobuf.Struct update = 2;
}

message ChildAgentControlResponse {
  bool ok = 1;
  string run_id = 2;
}

// ---------------------------------------------------------------------------
// 用户设置 — 系统提示词条目
// ---------------------------------------------------------------------------

message UserProfileRequest {
  string user_id = 1;
}

message UserKnowledgeDirUpdateRequest {
  string user_id = 1;
  string knowledge_dir = 2;
  string name = 3;
}

message UserProfileResponse {
  string user_id = 1;
  string knowledge_dir = 2;
  string created_at = 3;
  string updated_at = 4;
  string active_library_id = 5;
  KnowledgeLibraryEntry active_knowledge_library = 6;
  repeated KnowledgeLibraryEntry knowledge_libraries = 7;
  bool ocr_enabled = 8;
  bool vision_understanding_enabled = 9;
  bool auto_ingest_on_upload = 10;
  bool vlm_enabled = 11;
}

message AttachmentRawRequest {
  string uri = 1;
}

message AttachmentRawResponse {
  bytes content = 1;
  string mime_type = 2;
  string filename = 3;
}

message LLMConfigRequest {
  string user_id = 1;
}

message LLMConfigSaveRequest {
  string user_id = 1;
  string api_key = 2;
  string base_url = 3;
  string model_name = 4;
  string small_api_key = 5;
  string small_base_url = 6;
  string small_model_name = 7;
  int64 model_context_window_tokens = 8;
  int64 model_max_output_tokens = 9;
  int64 small_model_context_window_tokens = 10;
  int64 small_model_max_output_tokens = 11;
}

message LLMConfigResponse {
  string user_id = 1;
  string api_key = 2;
  string base_url = 3;
  string model_name = 4;
  string small_api_key = 5;
  string small_base_url = 6;
  string small_model_name = 7;
  string effective_small_api_key = 8;
  string effective_small_base_url = 9;
  string effective_small_model_name = 10;
  string updated_at = 11;
  string effective_api_key = 12;
  string effective_base_url = 13;
  string effective_model_name = 14;
  string effective_model_source = 15;
  string effective_small_model_source = 16;
  int64 model_context_window_tokens = 17;
  int64 model_max_output_tokens = 18;
  int64 small_model_context_window_tokens = 19;
  int64 small_model_max_output_tokens = 20;
}

message LLMConfigPresetSaveRequest {
  string user_id = 1;
  string label = 2;
  string api_key = 3;
  string base_url = 4;
  string model_name = 5;
}

message LLMConfigPresetDeleteRequest {
  string config_id = 1;
}

message LLMConfigPresetResponse {
  string config_id = 1;
  string user_id = 2;
  string label = 3;
  string api_key = 4;
  string base_url = 5;
  string model_name = 6;
  string created_at = 7;
  string updated_at = 8;
}

message LLMConfigPresetListResponse {
  repeated LLMConfigPresetResponse configs = 1;
}

message KnowledgeLibraryEntry {
  string library_id = 1;
  string user_id = 2;
  string name = 3;
  string knowledge_dir = 4;
  bool is_active = 5;
  string created_at = 6;
  string updated_at = 7;
}

message KnowledgeRebuildRequest {
  string user_id = 1;
  string knowledge_dir = 2;
}

message KnowledgeFileUploadRequest {
  string user_id = 1;
  string filename = 2;
  string relative_dir = 3;
  bytes content = 4;
}

message KnowledgeRebuildResponse {
  string user_id = 1;
  string knowledge_dir = 2;
  string frontmatter_dir = 3;
  int32 frontmatter_files_seen = 4;
  int32 frontmatter_files_written = 5;
  int32 frontmatter_files_skipped = 6;
  int32 files_seen = 7;
  int32 files_ingested = 8;
  int32 files_skipped = 9;
  int32 chunks_created = 10;
  int32 chunks_deleted = 11;
  string uploaded_path = 12;
  string library_id = 13;
}

message KnowledgeFileTreeRequest {
  string user_id = 1;
}

message KnowledgeFileNode {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  string mtime = 4;
  string index_status = 5;
  int64 size = 6;
  repeated KnowledgeFileNode children = 7;
  string graph_status = 8;
  string created_at = 9;
}

message KnowledgeFileTreeResponse {
  repeated KnowledgeFileNode tree = 1;
}

message KnowledgeFileContentRequest {
  string user_id = 1;
  string path = 2;
}

message KnowledgeFileContentResponse {
  string path = 1;
  string content = 2;
  string mtime = 3;
  int64 size = 4;
}

message KnowledgePdfPageRequest {
  string user_id = 1;
  string path = 2;
  int32 page = 3;
}

message KnowledgePdfPageResponse {
  bytes content = 1;
  string mime_type = 2;
}

message KnowledgeFileWriteRequest {
  string user_id = 1;
  string path = 2;
  string content = 3;
}

message KnowledgeFileCreateRequest {
  string user_id = 1;
  string path = 2;
  string content = 3;
}

message KnowledgeFolderCreateRequest {
  string user_id = 1;
  string path = 2;
}

message KnowledgePathCopyRequest {
  string user_id = 1;
  string source_path = 2;
  string target_path = 3;
}

message KnowledgePathDeleteRequest {
  string user_id = 1;
  string path = 2;
}

message KnowledgePathRenameRequest {
  string user_id = 1;
  string source_path = 2;
  string target_path = 3;
}

message SystemPromptRequest {
  string user_id = 1;
}

message SystemPromptEntryResponse {
  string prompt_id = 1;
  string content = 2;
  string created_at = 3;
}

message SystemPromptEntriesResponse {
  repeated SystemPromptEntryResponse entries = 1;
}

message SystemPromptAddRequest {
  string user_id = 1;
  string content = 2;
}

message SystemPromptDeleteRequest {
  string prompt_id = 1;
}

// ---------------------------------------------------------------------------
// 用户设置 — 自定义长期记忆
// ---------------------------------------------------------------------------

message MemoryListRequest {
  string user_id = 1;
}

message MemoryEntryResponse {
  string memory_id = 1;
  string content = 2;
  double importance = 3;
  string created_at = 4;
}

message MemoryListResponse {
  repeated MemoryEntryResponse entries = 1;
}

message MemoryAddRequest {
  string user_id = 1;
  string content = 2;
  double importance = 3;
}

message MemoryDeleteRequest {
  string memory_id = 1;
}
